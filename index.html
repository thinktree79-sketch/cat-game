<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>냥냥 매치</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#FBF3E8;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 12px 40px;
  }
  header{text-align:center;margin-bottom:18px}
  header h1{font-size:22px;font-weight:700;color:#3D2B1A;letter-spacing:-.3px}
  header p{font-size:13px;color:#9A7A60;margin-top:4px}
  .topbar{
    display:flex;justify-content:space-between;align-items:baseline;
    width:100%;max-width:440px;margin-bottom:4px
  }
  .topbar .score-area span{font-size:14px;color:#7A6050}
  .topbar .score-area #score{font-size:22px;font-weight:600;color:#3D2B1A}
  .topbar .right-area{font-size:13px;color:#7A6050;text-align:right}
  #msg{
    min-height:20px;font-size:13px;color:#C07A30;
    text-align:center;margin:4px 0 10px;
    width:100%;max-width:440px;
  }
  #board{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    width:100%;max-width:440px;
    margin-bottom:14px;
  }
  .cell{
    aspect-ratio:1;
    background:#F0E4D0;
    border:1.5px solid #E0C9A8;
    border-radius:12px;
    cursor:grab;
    display:flex;align-items:center;justify-content:center;
    padding:3px;
    touch-action:none;
    user-select:none;
    overflow:hidden;
    transition:border-color .15s, transform .1s;
  }
  .cell:active{transform:scale(.93)}
  .cell.sel{border:2.5px solid #D4537E;box-shadow:0 0 0 2px #F9A8C280}
  .cell img{
    width:100%;height:100%;
    object-fit:cover;
    border-radius:9px;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
  }
  @keyframes popOut{0%{transform:scale(1);opacity:1}100%{transform:scale(0.15);opacity:0}}
  .cell.clear img,.cell.clear svg{animation:popOut .22s ease forwards}
  .btns{display:flex;gap:10px;width:100%;max-width:440px}
  .btns button{
    flex:1;
    padding:11px 0;
    border-radius:12px;
    border:1.5px solid #D9C4A8;
    background:#FFF8EF;
    font-size:14px;
    font-weight:600;
    color:#5A3E28;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.45;cursor:default}
  #restart.urgent{border-color:#D85A30;color:#D85A30}
  .ad-modal{position:fixed;inset:0;background:rgba(20,14,8,.78);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px}
  .ad-modal.hidden{display:none}
  .ad-modal-inner{position:relative;max-width:min(94vw,640px)}
  .ad-modal-inner img{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .ad-modal-close{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;background:#fff;border:none;font-size:16px;font-weight:700;color:#5A3E28;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  footer{
    margin-top:24px;
    font-size:12px;color:#BFA98A;
    text-align:center;
    line-height:1.7;
  }
</style>
</head>
<body>

<div id="adModal" class="ad-modal hidden">
  <div class="ad-modal-inner">
    <img id="adModalImg" src="" alt="광고 이미지">
    <button class="ad-modal-close" id="adModalClose">✕</button>
  </div>
</div>


<header>
  <h1>🐱 냥냥 매치</h1>
  <p>같은 고양이 3마리를 밀어서 맞춰요</p>
</header>

<div class="topbar">
  <div class="score-area">점수 <span id="score">0</span></div>
  <div class="right-area">레벨 <span id="level">1</span> &nbsp;·&nbsp; 최고 <span id="best">0</span></div>
</div>
<div id="msg">&nbsp;</div>
<div id="board"></div>
<div class="btns">
  <button id="shuffle">판 섞기 (0회)</button>
  <button id="restart">다시 시작</button>
</div>

<footer>
  밀거나 두 번 눌러서 이웃한 고양이와 자리를 바꿔요<br>
  츄르(🟡)가 근처에서 터지면 가로줄 전체 보너스!
</footer>

  function activeCount(){ return Math.min(4+(level-1),picNames.length); }
  function icon(v){ if(v<=ADBASE){ var k=adKeys[ADBASE-v]; return '<img src="'+adPics[k]+'" alt="ad-'+k+'" draggable="false" style="border:2px solid #F6C445"/>'; } return '<img src="'+catPics[picNames[v]]+'" alt="'+picNames[v]+'" draggable="false"/>'; }
  function adChance(){ return 0.05; }

  var adUnlockScore={kitchen1:0,living1:0,living2:0,kitchen2:0,shocked_agent:0,heart_agent:3000,thumbsup_agent:8000};
  function availableAdKeys(){
    return adKeys.filter(function(k){ return score>=(adUnlockScore[k]||0); });
  }
  function randType(){
    if(Math.random()<adChance()){
      var avail=availableAdKeys();
      if(avail.length){
        var k=avail[Math.floor(Math.random()*avail.length)];
        return ADBASE-adKeys.indexOf(k);

  }
  function idx(r,c){ return r*N+c; }
  function rowOf(i){ return Math.floor(i/N); }
  function colOf(i){ return i%N; }
  function neighborIndex(i,dir){
    var r=rowOf(i),c=colOf(i);
    if(dir==='up')r--;else if(dir==='down')r++;else if(dir==='left')c--;else c++;
    if(r<0||r>=N||c<0||c>=N)return null;
    return idx(r,c);
  }
  function neighbors(i){
    var out=[];
    ['up','down','left','right'].forEach(function(d){var n=neighborIndex(i,d);if(n!==null)out.push(n);});
    return out;
  }
  function findMatches(){
    var bad=new Set();
    for(var r=0;r<N;r++){var run=1;for(var c=1;c<=N;c++){var same=c<N&&grid[idx(r,c)]!==null&&!isSpecial(grid[idx(r,c)])&&grid[idx(r,c)]===grid[idx(r,c-1)];if(same)run++;else{if(run>=3)for(var k=1;k<=run;k++)bad.add(idx(r,c-k));run=1;}}}
    for(c=0;c<N;c++){run=1;for(r=1;r<=N;r++){same=r<N&&grid[idx(r,c)]!==null&&!isSpecial(grid[idx(r,c)])&&grid[idx(r,c)]===grid[idx(r-1,c)];if(same)run++;else{if(run>=3)for(k=1;k<=run;k++)bad.add(idx(r-k,c));run=1;}}}
    return bad;
  }
  function hasAnyMove(){
    var dirs=['right','down'];
    for(var i=0;i<N*N;i++){for(var d=0;d<dirs.length;d++){var n=neighborIndex(i,dirs[d]);if(n===null)continue;var a=grid[i],b=grid[n];grid[i]=b;grid[n]=a;var m=findMatches();grid[i]=a;grid[n]=b;if(m.size>0)return true;}}
    return false;
  }
  function clearStuckWarning(){msgEl.textContent='\u00a0';restartBtn.classList.remove('urgent');}
  function checkStuck(){
    if(!hasAnyMove()){
      if(charges>0){msgEl.textContent='더 이상 맞출 조합이 없어요. "판 섞기"를 써보세요!';}
      else{msgEl.textContent='더 이상 맞출 수 있는 조합이 없어요. 다시 시작을 눌러주세요.';restartBtn.classList.add('urgent');}
    }
  }
  function expandWithChuru(matched){
    var bonus=0,triggered=[];
    matched.forEach(function(i){neighbors(i).forEach(function(n){if(isSpecial(grid[n])&&!matched.has(n)&&triggered.indexOf(n)===-1)triggered.push(n);});});
    triggered.forEach(function(ci){var r=rowOf(ci);for(var c=0;c<N;c++)matched.add(idx(r,c));bonus+=(grid[ci]<=ADBASE)?150:80;});
    return bonus;
  }
  function applyGravity(){for(var c=0;c<N;c++){var col=[];for(var r=N-1;r>=0;r--)if(grid[idx(r,c)]!==null)col.push(grid[idx(r,c)]);for(r=N-1;r>=0;r--)grid[idx(r,c)]=col[N-1-r]!==undefined?col[N-1-r]:null;}}
  function refill(){for(var i=0;i<N*N;i++)if(grid[i]===null)grid[i]=randType();}
  function levelForScore(s){var L=1;while(500*L*(L+1)<=s)L++;return L;}
  function updateShuffleBtn(){shuffleBtn.textContent='판 섞기 ('+charges+'회)';shuffleBtn.disabled=busy||charges<=0;}
  function checkLevelUp(){
    var newLevel=levelForScore(score);
    if(newLevel>level){var gained=newLevel-level;level=newLevel;charges+=gained;updateShuffleBtn();levelEl.textContent=level;msgEl.textContent='레벨 '+level+'! 판 섞기 기회를 얻었어요';setTimeout(function(){if(msgEl.textContent.indexOf('레벨 '+level)===0)msgEl.textContent='\u00a0';},2000);}
  }
  function render(clearedSet){
    board.innerHTML='';
    for(var i=0;i<N*N;i++){
      var cell=document.createElement('div');
      cell.className='cell'+(i===selected?' sel':'')+(clearedSet&&clearedSet.has(i)?' clear':'');
      if(grid[i]!==null)cell.innerHTML=icon(grid[i]);
      cell.dataset.i=i;
      cell.addEventListener('pointerdown',onPointerDown);
      cell.addEventListener('pointerup',onPointerUp);
      board.appendChild(cell);
    }
  }
  function cascade(chain){
    var matches=findMatches();
    if(matches.size===0){busy=false;updateShuffleBtn();checkStuck();return;}
    var bonus=expandWithChuru(matches);render(matches);
    score+=matches.size*10*chain+bonus;scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;}
    checkLevelUp();
    setTimeout(function(){matches.forEach(function(i){grid[i]=null;});applyGravity();refill();render();setTimeout(function(){cascade(chain+1);},250);},220);
  }
  function attemptSwap(a,b){
    busy=true;updateShuffleBtn();
    var tmp=grid[a];grid[a]=grid[b];grid[b]=tmp;render();
    var matches=findMatches();
    if(matches.size>0){cascade(1);}
    else{setTimeout(function(){var tmp2=grid[a];grid[a]=grid[b];grid[b]=tmp2;render();busy=false;updateShuffleBtn();},260);}
  }
  function isAdjacent(a,b){var ra=rowOf(a),ca=colOf(a),rb=rowOf(b),cb=colOf(b);return(ra===rb&&Math.abs(ca-cb)===1)||(ca===cb&&Math.abs(ra-rb)===1);}
  function showAdModal(key){
    document.getElementById('adModalImg').src = adPicsBig[key];
    document.getElementById('adModal').classList.remove('hidden');
  }
  function hideAdModal(){
    document.getElementById('adModal').classList.add('hidden');
  }
  document.getElementById('adModalClose').addEventListener('click', hideAdModal);
  document.getElementById('adModal').addEventListener('click', function(e){
    if(e.target.id==='adModal') hideAdModal();
  });

  function onPointerDown(e){
    if(busy)return;
    startX=e.clientX;startY=e.clientY;startIdx=parseInt(e.currentTarget.dataset.i,10);
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}
  }
  function onPointerUp(e){
    if(busy||startIdx===null)return;
    var dx=e.clientX-startX,dy=e.clientY-startY;
    var absx=Math.abs(dx),absy=Math.abs(dy);
    var i=startIdx;startIdx=null;
    if(Math.max(absx,absy)<16){
      if(grid[i]<=ADBASE){ showAdModal(adKeys[ADBASE-grid[i]]); return; }
      if(selected===null){selected=i;render();return;}
      if(selected===i){selected=null;render();return;}
      if(isAdjacent(selected,i)){var a=selected;selected=null;attemptSwap(a,i);}
      else{selected=i;render();}
      return;
    }
    var dir=absx>absy?(dx>0?'right':'left'):(dy>0?'down':'up');
    var target=neighborIndex(i,dir);selected=null;
    if(target!==null)attemptSwap(i,target);else render();
  }
  function doShuffle(){
    if(busy||charges<=0)return;charges--;updateShuffleBtn();
    var guard=0;
    do{for(var i=0;i<N*N;i++)grid[i]=randType();guard++;}while((findMatches().size>0||!hasAnyMove())&&guard<300);
    render();clearStuckWarning();checkStuck();
  }
  function init(){
    score=0;level=1;selected=null;busy=false;charges=0;
    scoreEl.textContent=0;levelEl.textContent=1;msgEl.textContent='\u00a0';
    restartBtn.classList.remove('urgent');updateShuffleBtn();grid=[];
    for(var i=0;i<N*N;i++)grid.push(Math.floor(Math.random()*activeCount()));
    var guard=0;
    while((findMatches().size>0||!hasAnyMove())&&guard<300){for(var j=0;j<N*N;j++)grid[j]=Math.floor(Math.random()*activeCount());guard++;}
    render();
  }
  restartBtn.addEventListener('click',init);
  shuffleBtn.addEventListener('click',doShuffle);
  init();
})();
</script>

</body>
